name: docker-publish

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - 'main'
  schedule:
    # Weekly rebuild of the latest release to pick up base image fixes.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_IMAGE: docker.io/vnxme/caddy
  GHCR_IMAGE: ghcr.io/vnxme/caddy
  # Scheduled and manual runs rebuild the latest release tag and push only
  # a dated tag (e.g. 2.11.3-20261130); all other tags stay where they are.
  REBUILD: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select source
        id: src
        run: |
          if [ "$REBUILD" = "true" ]; then
            tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
            git worktree add --detach release "$tag"
            echo "Rebuilding release $tag"
            echo "context=release" >> "$GITHUB_OUTPUT"
            echo "dated-tag=${tag#v}-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          else
            echo "context=." >> "$GITHUB_OUTPUT"
          fi

      - name: Check README module list
        if: env.REBUILD != 'true'
        run: sh .github/scripts/check-readme.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.src.outputs.context }}
          platforms: linux/amd64
          pull: true
          load: true
          provenance: false
          tags: caddy:test
          cache-from: type=gha

      - name: Smoke test
        run: sh .github/scripts/smoke-test.sh caddy:test "${{ steps.src.outputs.context }}/Dockerfile"

      - name: Build test binary (linux/arm/v6)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.src.outputs.context }}
          platforms: linux/arm/v6
          pull: true
          provenance: false
          outputs: type=local,dest=${{ runner.temp }}/armv6
          cache-from: type=gha

      - name: Check ARMv6 binary
        run: sh .github/scripts/check-goarm.sh "$RUNNER_TEMP/armv6/usr/bin/caddy" 6

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=branch,enable=${{ env.REBUILD != 'true' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,enable=${{ env.REBUILD != 'true' }}
            type=raw,value=${{ steps.src.outputs.dated-tag }},enable=${{ env.REBUILD == 'true' }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.src.outputs.context }}
          platforms: |
            linux/amd64
            linux/arm/v6
            linux/arm/v7
            linux/arm64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
