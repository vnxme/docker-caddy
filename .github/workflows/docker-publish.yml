name: docker-publish

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - 'main'
  schedule:
    # Weekly refresh of the latest release on updated base images.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and push even if the base images are unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_IMAGE: docker.io/vnxme/caddy
  GHCR_IMAGE: ghcr.io/vnxme/caddy
  # Scheduled and manual runs rebuild the latest release tag. They re-push its
  # version tags (e.g. 2.11.3, 2.11, 2, latest) plus a fixed dated tag
  # (e.g. 2.11.3-20261130), but only when a base image changed upstream.
  REBUILD: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  BUILDER_DIGEST_LABEL: io.github.vnxme.docker-caddy.builder.digest
  RUNTIME_DIGEST_LABEL: org.opencontainers.image.base.digest

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.src.outputs.tag }}
      dated-tag: ${{ steps.src.outputs.dated-tag }}
      builder-image: ${{ steps.base.outputs.builder-image }}
      builder-digest: ${{ steps.base.outputs.builder-digest }}
      runtime-image: ${{ steps.base.outputs.runtime-image }}
      runtime-digest: ${{ steps.base.outputs.runtime-digest }}
      build: ${{ steps.base.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select source
        id: src
        run: |
          if [ "$REBUILD" = "true" ]; then
            tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
            git worktree add --detach release "$tag"
            echo "Rebuilding release $tag"
            {
              echo "tag=$tag"
              echo "dated-tag=${tag#v}-$(date -u +%Y%m%d)"
              echo "context=release"
            } >> "$GITHUB_OUTPUT"
          else
            echo "context=." >> "$GITHUB_OUTPUT"
          fi

      - name: Check README module list
        if: env.REBUILD != 'true'
        run: sh .github/scripts/check-readme.sh

      - name: Check base images
        id: base
        env:
          CONTEXT: ${{ steps.src.outputs.context }}
          TAG: ${{ steps.src.outputs.tag }}
          FORCE: ${{ inputs.force == true }}
        run: |
          caddy_version=$(sed -n 's/^ARG CADDY_VERSION=//p' "$CONTEXT/Dockerfile")
          if [ -z "$caddy_version" ]; then
            echo "::error::No CADDY_VERSION ARG in $CONTEXT/Dockerfile. Release $TAG predates this workflow; cut a new release."
            exit 1
          fi
          builder_image="docker.io/library/caddy:${caddy_version}-builder"
          runtime_image="docker.io/library/caddy:${caddy_version}-alpine"
          builder_digest=$(docker buildx imagetools inspect "$builder_image" --format '{{.Manifest.Digest}}')
          runtime_digest=$(docker buildx imagetools inspect "$runtime_image" --format '{{.Manifest.Digest}}')
          echo "Builder: $builder_image@$builder_digest"
          echo "Runtime: $runtime_image@$runtime_digest"

          build=true
          if [ "$REBUILD" = "true" ] && [ "$FORCE" != "true" ]; then
            published="$DOCKERHUB_IMAGE:${TAG#v}"
            labels=$(docker buildx imagetools inspect "$published" \
              --format '{{json (index .Image "linux/amd64").Config.Labels}}' 2>/dev/null || echo '{}')
            prev_builder=$(echo "$labels" | jq -r --arg k "$BUILDER_DIGEST_LABEL" '.[$k] // empty')
            prev_runtime=$(echo "$labels" | jq -r --arg k "$RUNTIME_DIGEST_LABEL" '.[$k] // empty')
            echo "Published $published was built from builder ${prev_builder:-<unknown>}, runtime ${prev_runtime:-<unknown>}"
            if [ "$prev_builder" = "$builder_digest" ] && [ "$prev_runtime" = "$runtime_digest" ]; then
              build=false
              echo "::notice::Base images unchanged since $published was pushed; nothing to rebuild."
            fi
          fi

          {
            echo "builder-image=$builder_image"
            echo "builder-digest=$builder_digest"
            echo "runtime-image=$runtime_image"
            echo "runtime-digest=$runtime_digest"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      CONTEXT: ${{ needs.prepare.outputs.tag && 'release' || '.' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out release
        if: env.TAG != ''
        run: git worktree add --detach release "$TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64
          pull: true
          load: true
          provenance: false
          tags: caddy:test
          cache-from: type=gha

      - name: Smoke test
        run: sh .github/scripts/smoke-test.sh caddy:test "$CONTEXT/Dockerfile"

      - name: Build test binary (linux/arm/v6)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/arm/v6
          pull: true
          provenance: false
          outputs: type=local,dest=${{ runner.temp }}/armv6
          cache-from: type=gha

      - name: Check ARMv6 binary
        run: sh .github/scripts/check-goarm.sh "$RUNNER_TEMP/armv6/usr/bin/caddy" 6

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          # On rebuilds, value= points the semver tags at the release being
          # rebuilt; otherwise it is empty and they follow the pushed git tag.
          tags: |
            type=ref,event=branch,enable=${{ env.REBUILD != 'true' }}
            type=ref,event=pr
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
            type=sha,enable=${{ env.REBUILD != 'true' }}
            type=raw,value=${{ needs.prepare.outputs.dated-tag }},enable=${{ env.REBUILD == 'true' }}
          # Recorded so the weekly rebuild can tell whether a base image changed.
          labels: |
            ${{ env.BUILDER_DIGEST_LABEL }}=${{ needs.prepare.outputs.builder-digest }}
            org.opencontainers.image.base.name=${{ needs.prepare.outputs.runtime-image }}
            ${{ env.RUNTIME_DIGEST_LABEL }}=${{ needs.prepare.outputs.runtime-digest }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          platforms: |
            linux/amd64
            linux/arm/v6
            linux/arm/v7
            linux/arm64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
